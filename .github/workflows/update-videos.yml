name: Update YouTube videos

on:
  schedule:
    - cron: "0 */6 * * *"   # setiap 6 jam
  workflow_dispatch:         # bisa dijalankan manual dari tab Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ambil video terbaru @boysnocry
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          python3 - << 'PY'
          import json, os, sys, time, urllib.request, urllib.parse, xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          CHANNEL_ID = "UCvXBb55-NxB9N1mUjOafjRg"
          UPLOADS = "UU" + CHANNEL_ID[2:]          # playlist "Uploads" channel
          LIMIT = 6
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}

          def get(url):
              req = urllib.request.Request(url, headers=UA)
              return urllib.request.urlopen(req, timeout=30).read()

          # 1) YouTube Data API v3 (paling andal, perlu secret YT_API_KEY)
          def from_api():
              key = os.environ.get("YT_API_KEY", "").strip()
              if not key:
                  raise RuntimeError("secret YT_API_KEY belum diisi")
              q = urllib.parse.urlencode({"part": "snippet,contentDetails",
                                          "playlistId": UPLOADS, "maxResults": LIMIT, "key": key})
              data = json.loads(get("https://www.googleapis.com/youtube/v3/playlistItems?" + q))
              out = []
              for it in data.get("items", []):
                  sn, cd = it["snippet"], it.get("contentDetails", {})
                  if sn.get("title") in ("Private video", "Deleted video"):
                      continue
                  out.append({"id": cd.get("videoId") or sn["resourceId"]["videoId"],
                              "title": sn["title"],
                              "published": cd.get("videoPublishedAt") or sn.get("publishedAt", "")})
              return out

          # 2) RSS feed (cadangan, kadang ditolak YouTube dari server GitHub)
          NS = {"a": "http://www.w3.org/2005/Atom", "yt": "http://www.youtube.com/xml/schemas/2015"}
          def from_rss(url):
              last = None
              for attempt in range(3):
                  try:
                      root = ET.fromstring(get(url))
                      return [{"id": e.findtext("yt:videoId", namespaces=NS),
                               "title": e.findtext("a:title", default="", namespaces=NS),
                               "published": e.findtext("a:published", default="", namespaces=NS)}
                              for e in root.findall("a:entry", NS)[:LIMIT]
                              if e.findtext("yt:videoId", namespaces=NS)]
                  except Exception as e:
                      last = e
                      time.sleep(3)
              raise last

          sources = [
              ("YouTube Data API", from_api),
              ("RSS channel", lambda: from_rss(f"https://www.youtube.com/feeds/videos.xml?channel_id={CHANNEL_ID}")),
              ("RSS playlist", lambda: from_rss(f"https://www.youtube.com/feeds/videos.xml?playlist_id={UPLOADS}")),
          ]

          videos = []
          for name, fn in sources:
              try:
                  videos = fn()
                  if videos:
                      print(f"OK via {name}: {len(videos)} video")
                      break
                  print(f"{name}: hasil kosong")
              except Exception as e:
                  print(f"{name} gagal: {e}")

          if not videos:
              print("::error::Semua sumber gagal. Isi secret YT_API_KEY (lihat panduan).")
              sys.exit(1)

          with open("videos.json", "w", encoding="utf-8") as f:
              json.dump({"updated": datetime.now(timezone.utc).isoformat(), "videos": videos},
                        f, ensure_ascii=False, indent=2)
          PY

      - name: Commit jika ada perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git diff --cached --quiet && echo "Tidak ada perubahan" && exit 0
          git commit -m "Update videos.json"
          git push
